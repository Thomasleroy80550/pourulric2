<!doctype html>
<html lang="fr" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#255f85" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hello Keys" />
    <link rel="apple-touch-icon" href="/icons/pwa-icon.png" />
    <title>Portail propriétaire Hello Keys</title>
  </head>

  <body class="notranslate" translate="no">
    <div id="splash-screen">
      <div class="splash-logo-wrap">
        <img src="/icons/pwa-icon.png" alt="Hello Keys" class="splash-logo" />
      </div>
      <p class="splash-title">Hello Keys</p>
      <div class="splash-dots"><span></span><span></span><span></span></div>
    </div>
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #2d6f9a 0%, #255f85 45%, #1c4a68 100%);
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      .splash-logo-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 104px;
        height: 104px;
        border-radius: 28px;
        background: #ffffff;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
        animation: splash-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .splash-logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
      }
      .splash-title {
        margin: 22px 0 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #ffffff;
        animation: splash-fade 0.6s ease 0.25s both;
      }
      .splash-dots {
        display: flex;
        gap: 8px;
        margin-top: 28px;
        animation: splash-fade 0.6s ease 0.45s both;
      }
      .splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.85);
        animation: splash-bounce 1s ease-in-out infinite;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.15s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-pop {
        from { transform: scale(0.6); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @keyframes splash-fade {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-bounce {
        0%, 100% { transform: translateY(0); opacity: 0.6; }
        50% { transform: translateY(-6px); opacity: 1; }
      }
    </style>
    <script>
      // Splash uniquement pour l'app installée (mode standalone), comme une app native.
      (function () {
        var standalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true;
        var el = document.getElementById("splash-screen");
        if (!standalone) {
          el.parentNode.removeChild(el);
          return;
        }
        window.__splashShownAt = Date.now();
      })();
    </script>
    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Charge le widget de support uniquement sur desktop (>= 768px)
      if (window.matchMedia("(min-width: 768px)").matches) {
        var s = document.createElement("script");
        s.src = "https://support.hellokeys.fr/widget.js";
        s.defer = true;
        s.setAttribute("data-color", "#255f85");
        s.setAttribute("data-title", "Hello Keys");
        s.setAttribute("data-subtitle", "Nous répondons en quelques minutes");
        s.setAttribute("data-position", "right");
        document.body.appendChild(s);
      }
    </script>
  </body>
</html>
